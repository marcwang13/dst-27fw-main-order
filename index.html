<!doctype html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}
/* rail: mobile fold bar (all order sites share this block) */
.rail-bar{display:none}
.rail-body{display:flex;flex-direction:column;gap:8px}
@media (max-width:760px){
  .rail .wrap{padding-block:0}
  .rail-bar{display:flex;align-items:center;gap:10px;min-height:54px;padding-block:7px}
  .rail-sum{flex:1;min-width:0;font-size:12px;line-height:1.4;color:var(--muted);cursor:pointer}
  .rail-sum b{display:block;font-size:14px;font-weight:600;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rail-tg{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:0 16px;border-radius:999px;border:1.5px solid var(--acc,var(--red));background:var(--acc,var(--red));color:var(--acc-ink,var(--red-ink));font-size:14px;font-weight:600}
  .rail-tg .ar{width:9px;height:9px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(2px) rotate(-135deg);transition:transform .18s}
  .rail.folded .rail-tg{background:transparent;color:var(--acc,var(--red));border-color:var(--acc,var(--red))}
  .rail.folded .rail-tg .ar{transform:translateY(-2px) rotate(45deg)}
  .rail-body{padding:2px 0 12px}
  .rail.folded .rail-body{display:none}
  .rail:not(.folded) .rail-bar{border-bottom:1px solid var(--line);margin-bottom:8px}
}

/* DSTC filter: four levels, four shapes */
.lv{display:flex;align-items:center;gap:12px;min-width:0}
.lv+.lv{border-top:1px solid var(--line);padding-top:8px}
.lv-l{flex:none;width:32px;font-size:11px;letter-spacing:.08em;color:var(--muted)}
.lv-sr{align-items:flex-start}.lv-sr .lv-l{padding-top:6px}
.lv-rg .lv-l{width:auto!important;white-space:nowrap}
.seg{display:inline-flex;max-width:100%;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg .sg{border:0;border-right:1px solid var(--line);background:transparent;padding:5px 14px;font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:baseline;white-space:nowrap}
.seg .sg:last-child{border-right:0}
.seg .sg small{font-family:var(--f-mono);font-size:11px;opacity:.7}
.seg .sg[aria-pressed="true"]{background:var(--sunk);color:var(--fg);font-weight:600}
.seg .sg[disabled]{opacity:.4;cursor:default}
.cgs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0}
.cgs::-webkit-scrollbar{display:none}
.ct{flex:none;display:flex;align-items:center;gap:8px;border:0;border-bottom:3px solid transparent;background:transparent;padding:7px 14px;font-size:15px;font-weight:600;color:var(--muted)}
.ct svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ct small{font-family:var(--f-mono);font-size:11px;font-weight:400;opacity:.7}
.ct:hover{color:var(--fg)}
.ct[aria-pressed="true"]{color:var(--fg);border-bottom-color:var(--acc)}
.ct[aria-pressed="true"] svg{color:var(--acc)}
.ct[disabled]{opacity:.4;cursor:default}
#tabs.tabs{flex-wrap:wrap;overflow:visible;gap:6px;min-width:0}
#tabs .tab{border-radius:6px;border-width:1px;padding:4px 11px;font-size:12px;font-weight:600;letter-spacing:.04em}
#tabs .tab[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.subs{display:flex;flex-wrap:wrap;gap:2px 18px;min-width:0}
.st{border:0;border-bottom:2px solid transparent;background:transparent;padding:3px 0;font-size:12.5px;color:var(--muted);display:inline-flex;gap:5px;align-items:center}
.st::before{content:"# ";opacity:.45}
.st small{font-family:var(--f-mono);font-size:11px;opacity:.7}
.st:hover{color:var(--fg)}
.st[aria-pressed="true"]{color:var(--fg);border-bottom-color:var(--acc);font-weight:600}
.st[disabled]{opacity:.4;cursor:default}
.st .dot{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--acc);color:var(--acc-ink);font-size:11px;font-family:var(--f-mono);display:inline-grid;place-items:center}
.crumb{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;color:var(--fg);background:var(--acc-soft);border-left:4px solid var(--acc);border-radius:4px;padding:8px 12px}
.crumb-l{display:inline-block;background:var(--acc);color:var(--acc-ink);border-radius:3px;padding:1px 8px;margin-right:10px;font-size:12.5px;font-weight:700;letter-spacing:.06em}
.crumb b{font-weight:700}
.crumb button{border:0;background:transparent;color:var(--acc);font-size:13px;font-weight:600;padding:2px 0}
@media (max-width:760px){
  .lv{gap:8px}.lv-l{width:26px;font-size:10.5px}
  .seg .sg{padding:6px 11px}
  .ct{flex-direction:column;gap:1px;padding:6px 10px;font-size:12.5px}
  .ct small{display:none}
  .crumb{display:none}
}
</style>
<title>DESCENTE 27FW 正式訂貨（27Q3Q4）</title>
<link rel="icon" type="image/svg+xml" href="https://emerswhl-restock.surge.sh/favicon.svg"><link rel="icon" type="image/png" sizes="32x32" href="https://emerswhl-restock.surge.sh/brand/favicon-32.png"><link rel="shortcut icon" href="https://emerswhl-restock.surge.sh/brand/favicon.ico"><link rel="apple-touch-icon" href="https://emerswhl-restock.surge.sh/brand/apple-touch-icon.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky order header + filter rail, product rows as wide cards with an inline size grid, fixed tally bar at the bottom */
:root{
  --bg:#f2f4f8; --surface:#ffffff; --sunk:#e6ebf2; --line:#d2dae6; --fg:#121a26; --muted:#5d6979;
  --red:#b3261e; --red-ink:#ffffff; --red-soft:#fbe4e2; --ok:#1f7a4d; --ok-soft:#e3f2ea; --warn:#9a6200;
  --acc:#0b57c2; --acc-ink:#ffffff; --acc-soft:#e1ecfb;
  --brand:#0a3f94; --brand-ink:#ffffff; --brand-2:#072d6c;
  --f-disp:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1019; --surface:#131a26; --sunk:#1b2433; --line:#2b384d; --fg:#e8eef7; --muted:#97a5ba;
  --red:#f07a72; --red-ink:#ffffff; --red-soft:#3d1c1a; --ok:#4cc38a; --ok-soft:#173326; --warn:#e0a640;
  --acc:#6aa5f5; --acc-ink:#0b1019; --acc-soft:#16294a;
  --brand:#14408c; --brand-ink:#ffffff; --brand-2:#0c2b61; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1019; --surface:#131a26; --sunk:#1b2433; --line:#2b384d; --fg:#e8eef7; --muted:#97a5ba;
  --red:#f07a72; --red-ink:#ffffff; --red-soft:#3d1c1a; --ok:#4cc38a; --ok-soft:#173326; --warn:#e0a640;
  --acc:#6aa5f5; --acc-ink:#0b1019; --acc-soft:#16294a;
  --brand:#14408c; --brand-ink:#ffffff; --brand-2:#0c2b61; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;padding-bottom:96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--brand)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* masthead */
.mast{background:var(--brand);color:var(--brand-ink)}
.mast .wrap{display:flex;align-items:center;gap:16px;padding-block:14px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
/* EMERS-WHL TW 系統標：深色抬頭左側小 LOGO（保留原品牌名） */
.brand{align-items:center}
.brand .whl-logo{height:28px;width:auto;display:block;object-fit:contain}
.brand .whl-sep{width:1px;height:22px;background:rgba(255,255,255,.45);flex:none}

.brand b{font-family:var(--f-disp);font-weight:700;font-size:26px;letter-spacing:.1em;color:var(--brand-ink);line-height:1}
.brand span{font-family:var(--f-disp);font-weight:600;font-size:18px;letter-spacing:.08em;text-transform:uppercase}
.brand em{font-style:normal;color:color-mix(in srgb,var(--brand-ink) 70%,transparent);font-size:13px}
.views{margin-left:auto;display:flex;gap:4px;background:var(--brand-2);padding:3px;border-radius:999px}
.views button{border:1.5px solid transparent;background:transparent;padding:6px 14px;border-radius:999px;font-size:13px;color:color-mix(in srgb,var(--brand-ink) 75%,transparent)}
.views button[aria-pressed="true"]{background:#fff;color:#0a3f94;font-weight:600}
.views button:not([aria-pressed="true"]){border-color:rgb(255 255 255 / .45)}
.views button:not([aria-pressed="true"]):hover{border-color:#fff;color:#fff}

/* dealer form */
.dealer{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding-block:16px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:12px;color:var(--muted);letter-spacing:.04em}
.fld input,.fld textarea,.fld select{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;min-width:0;width:100%}
.fld.wide{grid-column:1/-1}
.fld textarea{resize:vertical;min-height:38px}
.req{color:var(--acc)}
.chaintg{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;padding-bottom:10px;cursor:pointer;width:fit-content}
.chaintg input{accent-color:var(--acc);width:16px;height:16px}
.chaintg small{font-weight:400;color:var(--muted)}
.brbar{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.brbar::-webkit-scrollbar{display:none}
.br.info{border-style:solid;border-color:var(--line);cursor:default}
.mx-wrap{overflow-x:auto;max-width:100%}
.mx{border-collapse:collapse;font-size:12px;margin-left:auto}
.mx th,.mx td{padding:2px 3px;border:0;text-align:center;vertical-align:middle;background:none}
.mx thead th{font-family:var(--f-disp);font-weight:600;color:var(--muted);letter-spacing:.04em}
.mx thead th>span:first-child{display:block}
.mx thead th .pct{margin:2px auto 0;position:relative;display:block;width:46px;height:15px;border-radius:3px;background:var(--sunk);overflow:hidden;font-family:var(--f-mono);font-size:10px;line-height:15px;color:var(--fg);letter-spacing:0}
.mx .pct i{position:absolute;left:0;top:0;bottom:0;background:color-mix(in srgb,var(--acc) 28%,transparent)}
.mx .pct b{position:relative;font-weight:500}
.mx .pct.na{color:var(--muted)}
.mx .bn{text-align:right;font-weight:600;color:var(--fg);max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:8px;font-family:var(--f-body)}
.mx td input{width:46px;height:32px;text-align:center;border:1.5px solid color-mix(in srgb,var(--acc) 35%,var(--line));border-radius:4px;background:var(--bg);font-family:var(--f-mono);font-size:13px;-moz-appearance:textfield}
.mx td input::-webkit-outer-spin-button,.mx td input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.mx td input.on{background:var(--acc-soft);border-color:var(--acc);color:var(--acc);font-weight:600}
.mx .bt,.mx tfoot td{font-family:var(--f-mono);font-weight:500;min-width:34px}
.mx tfoot th,.mx tfoot td{border-top:1px solid var(--line);padding-top:4px}
.brbar .lab{font-size:12px;color:var(--muted);flex:none}
.br{flex:none;border:1.5px dashed color-mix(in srgb,var(--acc) 50%,var(--line));background:var(--surface);border-radius:6px;padding:4px 10px;font-size:13px;display:flex;gap:6px;align-items:center}
.br small{font-family:var(--f-mono);color:var(--muted);font-size:11px}
.br[aria-pressed="true"]{border-style:solid;border-color:var(--acc);background:var(--acc-soft);color:var(--acc);font-weight:600}
.br.add,.br.mng{border-style:solid;color:var(--acc)}
.offbar{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-top:14px;padding:10px 14px;border-radius:var(--r);background:var(--acc-soft);border:1.5px solid color-mix(in srgb,var(--acc) 40%,transparent);font-size:13px;line-height:1.6}
.offbar b{color:var(--acc);flex:none}
.acct{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px;padding:10px 14px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--card);font-size:13px;line-height:1.6}
.acct.need{border-color:color-mix(in srgb,var(--acc) 55%,transparent);background:var(--acc-soft)}
.acct b{color:var(--acc)}
.acct .t{flex:1;min-width:220px}
.acct input{height:34px;padding:0 10px;border:1.5px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit;min-width:0}
.acct input.em{width:240px;max-width:100%}
.acct input.cd{width:110px;letter-spacing:4px;text-align:center}
.acct .am{flex-basis:100%;font-size:12px;color:var(--muted)}
.acct .am.err{color:var(--red)}
.offbar span{flex:1;min-width:220px}
.xlbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-bottom:14px;font-size:13px;color:var(--muted)}
.xlhint{font-size:12px}

/* filter rail */
.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.rail .wrap{display:flex;flex-direction:column;gap:8px;padding-block:10px}
.dnote{margin:10px 0 0;font-size:12.5px;color:var(--muted);line-height:1.6}.dnote summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--acc);padding:4px 0}.dnote summary:hover{text-decoration:underline}.dnote ul{margin-top:4px!important}.dnote ul{margin:0;padding-left:1.3em}.dnote li{margin:1px 0}
.btn.danger{border-color:var(--red);color:var(--red)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
@media (min-width:761px){.tabs{flex-wrap:wrap;overflow:visible}}
.tab{flex:none;border:1.5px solid color-mix(in srgb,var(--acc) 45%,var(--line));background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:500;display:flex;gap:6px;align-items:center;transition:border-color .15s,background .15s}
.tab:hover{border-color:var(--acc)}
.cgtabs .tab{padding:5px 16px;font-weight:600}
.tab[disabled]{opacity:.4;cursor:default}
.tab small{font-family:var(--f-mono);color:var(--muted);font-size:11px}
.tab[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.tab[aria-pressed="true"] small{color:inherit;opacity:.7}
.tab .dot{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--acc);color:var(--acc-ink);font-size:11px;font-family:var(--f-mono);display:inline-grid;place-items:center}
.row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{border:1.5px solid color-mix(in srgb,var(--acc) 40%,var(--line));background:var(--surface);border-radius:4px;padding:3px 9px;font-size:12px;font-family:var(--f-disp);font-weight:600;letter-spacing:.06em}
.chip:hover{border-color:var(--acc)}
.chip[aria-pressed="true"]{background:var(--acc-soft);border-color:var(--acc);color:var(--acc)}
.search{flex:1;min-width:160px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 10px}
.toggle{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--fg);white-space:nowrap;border:1.5px solid color-mix(in srgb,var(--acc) 40%,var(--line));border-radius:var(--r);padding:5px 10px;background:var(--surface);cursor:pointer}
.toggle input{accent-color:var(--acc)}

/* groups + product rows */
main{padding-block:12px}
.group{margin-top:22px}
.ghead{display:flex;align-items:baseline;gap:10px;margin:0 0 8px;flex-wrap:wrap}
.ghead h2{margin:0;font-family:var(--f-disp);font-weight:700;font-size:22px;letter-spacing:.05em;text-transform:uppercase}
.ghead span{color:var(--muted);font-size:13px}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:grid;grid-template-columns:132px minmax(0,1fr) auto;gap:14px;padding:10px;position:relative}
.item.has{border-color:var(--acc);box-shadow:inset 3px 0 0 var(--acc)}
.pic{position:relative;width:132px;aspect-ratio:1;max-width:100%;background:#fff;border-radius:6px;overflow:hidden;display:grid;place-items:center;border:1.5px solid color-mix(in srgb,var(--acc) 40%,var(--line));transition:border-color .15s,box-shadow .15s}
.pic:hover{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:4px;cursor:zoom-in}
.pic .none{color:#9a9aa2;font-size:12px}
.pic .sw{position:absolute;left:4px;bottom:4px;display:flex;gap:2px}
.pic .sw{left:4px;right:4px;bottom:4px;gap:3px}
.pic .sw button{flex:1;border:1.5px solid #0a3f94;font-size:11px;padding:2px 4px;border-radius:4px;background:#fff;color:#0a3f94;font-weight:600;cursor:zoom-in}
.pic .sw button:hover{background:#0a3f94;color:#fff}
.pic .sw button[aria-pressed="true"]{background:var(--acc)}
.pic .sw button[disabled]{border-color:#c4c7cf;color:#a3a7b0;background:#f3f4f6;cursor:default}
.pic .sw button[disabled]:hover{background:#f3f4f6;color:#a3a7b0}
.info{min-width:0;display:flex;flex-direction:column;gap:4px}
.t1{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.t1 h3{margin:0;font-size:15px;font-weight:700}
.en{font-family:var(--f-disp);font-weight:600;font-size:15px;letter-spacing:.04em;color:var(--muted)}
.meta{display:flex;gap:6px;flex-wrap:wrap;font-size:12px}
.tag{background:var(--sunk);border-radius:3px;padding:1px 7px}
.tag.c{font-family:var(--f-disp);font-weight:700;letter-spacing:.06em;font-size:13px}
.tag.m{background:var(--acc-soft);color:var(--acc);font-weight:600}
.tag.eb{background:#fff1d6;color:#8a5300;font-weight:600}
.tag.hot{background:var(--acc);color:var(--acc-ink);font-weight:600}
.tag.rc{background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc);font-weight:600}
.tag.nref{background:transparent;color:var(--muted);border:1px dashed var(--line)}
.ref{margin-top:6px;border:1px solid color-mix(in srgb,var(--acc) 35%,var(--line));border-radius:var(--r);background:var(--surface)}
.ref.none{display:flex;gap:10px;align-items:center;padding:7px 10px;border-style:dashed;border-color:var(--line)}
.ref-hd{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;padding:7px 10px;text-align:left;cursor:pointer;flex-wrap:wrap}
.ref-h{font-size:12px;font-weight:700;color:var(--acc);letter-spacing:.04em}
.ref-tier{font-size:11px;padding:1px 7px;border-radius:4px;background:var(--sunk);color:var(--muted)}
.ref-tier.t-L1{background:var(--acc-soft);color:var(--acc);font-weight:600}
.ref-s{font-size:12px;color:var(--fg);font-variant-numeric:tabular-nums}
.ref-hd .ar{margin-left:auto;width:7px;height:7px;border:solid var(--muted);border-width:0 1.5px 1.5px 0;transform:rotate(45deg)}
.ref.on .ref-hd .ar{transform:rotate(-135deg)}
.ref-b{border-top:1px solid var(--line);padding:10px;display:grid;gap:10px}
.ref-tabs{display:flex;gap:6px;flex-wrap:wrap}

<script>
/* GitHub Pages 版：以本機模擬原本 Claude 頁面的能力；送單改送到 Google Apps Script */
(function(){
  const CFG=window.SDR_CONFIG||{}; const URL_=(CFG.SUBMIT_URL||'').trim();
  const HKEY='dstc-27fw-sent-v1';
  let ticket='', fromHash=false;
  try{
    const q=new URLSearchParams(location.search);
    if(q.has('admin')){ q.delete('admin'); history.replaceState(null,'',location.pathname+(q.toString()?'?'+q:'')+location.hash); }
    ['sdr-admin','dst-admin','dstc-admin','bys-admin','byf-admin','ftw-admin'].forEach(k=>{ try{ localStorage.removeItem(k); }catch(e){} });
    const hm=/^#admin=([^&]+)/.exec(location.hash||'');
    if(hm){ fromHash=true; sessionStorage.setItem('pre-sso', decodeURIComponent(hm[1])); history.replaceState(null,'',location.pathname+location.search); }
    ticket=sessionStorage.getItem('pre-sso')||'';
  }catch(e){}
  let ADMIN='';
  let ACACHE={};
  function toPageOrder(o){ const IT=window.SDR_ITEMS||[]; const key=l=>{ const it=IT.find(i=>i.sku===l.sku&&i.sheet===l.sheet)||IT.find(i=>i.sku===l.sku); return it?it.id:('x:'+l.sku+'|'+l.color); };
    const agg={}; const br={}; const brOrder=[];
    for(const l of o.lines||[]){ const k=key(l); const a=agg[k+'|'+l.size]=agg[k+'|'+l.size]||{k,sheet:l.sheet,mon:l.mon,style:l.style,sku:l.sku,en:l.en,zh:l.zh,color:l.color,size:l.size,qty:0,price:l.price}; a.qty+=l.qty;
      if(l.branch){ if(!br[l.branch]){ br[l.branch]=[]; brOrder.push(l.branch); } br[l.branch].push({k,size:l.size,qty:l.qty}); } }
    return {...o,uid:o.oid,lines:Object.values(agg),branches:brOrder.map(n=>({name:n,lines:br[n]}))}; }
  async function adminList(){ await memberGate; if(!ADMIN){ const err=new Error('forbidden'); err.code='forbidden'; throw err; } const raw=await post({action:'list',ticket:ADMIN}); let j; try{ j=JSON.parse(raw); }catch(e){ j={error:'bad'}; } if(j.error){ const err=new Error(j.error==='forbidden'?'訂單彙整權限無效或已過期':j.error); err.code=j.error; throw err; } ACACHE={}; (j.orders||[]).forEach(o=>{ ACACHE[o.oid]=toPageOrder(o); }); return Object.values(ACACHE); }
  let dev=null; try{ dev=localStorage.getItem('dstc-dev'); if(!dev){ dev='d'+Math.random().toString(36).slice(2,10); localStorage.setItem('dstc-dev',dev); } }catch(e){ dev='d'+Math.random().toString(36).slice(2,10); }
  const hist=()=>{ try{ return JSON.parse(localStorage.getItem(HKEY)||'[]'); }catch(e){ return []; } };
  const AKEY='dstc-auth'; let SRV=[];
  const auth=()=>{ try{ const a=JSON.parse(localStorage.getItem(AKEY)||'null'); return a&&a.email&&a.token?a:null; }catch(e){ return null; } };
  const subs=[]; const emit=()=>{ const ids=new Set(SRV.map(o=>o.oid)); const docs=[...SRV,...hist().filter(o=>!ids.has(o.oid))].sort((a,b)=>String(b.submittedAt).localeCompare(String(a.submittedAt))).map(d=>({id:d.oid,exists:true,data:()=>d})); subs.forEach(f=>f({docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{fromCache:false,hasPendingWrites:false}})); };
  async function post(body){ const opt={method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)};
    try{ const r=await fetch(URL_,{...opt,redirect:'follow'}); return (await r.text()).trim(); }
    catch(e){ await fetch(URL_,{...opt,mode:'no-cors'}); return 'ok'; } }
  const memberGate=(async()=>{
    if(!ticket||!URL_) return;
    try{
      const raw=await post({action:'member',ticket});
      const j=JSON.parse(raw);
      if(j&&j.ok) ADMIN=ticket;
      else { ticket=''; try{ sessionStorage.removeItem('pre-sso'); }catch(e){} }
    }catch(e){ ticket=''; try{ sessionStorage.removeItem('pre-sso'); }catch(x){} }
    window.SDR_ADMIN.on=!!ADMIN;
    if(ADMIN&&fromHash){ let n=0; const iv=setInterval(()=>{ const v=document.getElementById('v-admin'); if(v&&!v.hidden){ clearInterval(iv); v.click(); } else if(++n>50) clearInterval(iv); },100); }
  })();
  async function refreshMine(){ const a=auth(); if(!a||!URL_){ SRV=[]; emit(); return; } try{ const t=await post({action:'mine',auth:a}); const j=JSON.parse(t); if(j.error==='login_required'){ try{ localStorage.removeItem(AKEY); }catch(e){} SRV=[]; } else SRV=(j.orders||[]).map(toPageOrder); }catch(e){} emit(); }
  window.SDR_AUTH={ get:auth,
    async sendCode(email){ return await post({action:'otp_send',email}); },
    async verify(email,code){ const t=await post({action:'otp_verify',email,code}); let j; try{ j=JSON.parse(t); }catch(e){ j={error:t}; } if(j.token){ try{ localStorage.setItem(AKEY,JSON.stringify({email:j.email,token:j.token})); }catch(e){} refreshMine(); } return j; },
    logout(){ try{ localStorage.removeItem(AKEY); }catch(e){} SRV=[]; emit(); } };
  const KNOWN=['login_required','forbidden'];
  window.SDR_ADMIN={ on:!!ADMIN,
    async list(){ return await adminList(); },
    async del(oid){ const res=await post({action:'admin_delete',oid,ticket:ADMIN}); if(res==='ok'||res==='deleted') return; const err=new Error(res==='forbidden'?'訂單彙整權限無效或已過期':res==='void'?'這張訂單已作廢':res); err.code=res; throw err; },
    async save(body){ const res=await post({...body,action:'admin_save',ticket:ADMIN}); delete body._xlsx; delete body._xlsxName;
      if(res==='ok'||/<html/i.test(res)) return; const err=new Error(res==='forbidden'?'訂單彙整權限無效或已過期':res==='deleted'?'這張訂單已不在試算表（客人可能已刪除）':res==='void'?'這張訂單已作廢':res); err.code=res; throw err; } };
  const db={ doc(path){ const p=path.split('/'); return { async set(body){ if(p.length===4&&p[2]==='subs'){ const res=await post({...body,auth:auth()}); delete body._xlsx; delete body._xlsxName; if(KNOWN.includes(res)){ const err=new Error(res); err.code=res; throw err; } if(res==='deleted'||res==='void'){ try{ localStorage.setItem(HKEY,JSON.stringify(hist().filter(x=>x.oid!==body.oid))); }catch(e){} emit(); const err=new Error('order_closed'); err.code='order_closed'; throw err; } if(res&&res!=='ok'&&!/<html/i.test(res)) { const err=new Error(res); err.code='server'; throw err; } const h=hist().filter(x=>x.oid!==body.oid); h.push(body); try{ localStorage.setItem(HKEY,JSON.stringify(h)); }catch(e){} SRV=SRV.filter(x=>x.oid!==body.oid); emit(); refreshMine(); } }, async update(body){ if(p.length===4&&p[2]==='subs'&&ADMIN&&body&&body.status){ const res=await post({action:'status',oid:p[3],status:body.status,ticket:ADMIN}); if(res!=='ok'){ const err=new Error(res==='forbidden'?'訂單彙整權限無效或已過期':res==='deleted'?'這張訂單已不在試算表':res); err.code=res; throw err; } if(ACACHE[p[3]]) ACACHE[p[3]].status=body.status; } }, async delete(){ if(p.length===4&&p[2]==='subs'){ const res=await post({action:'cancel',oid:p[3],auth:auth()}); if(KNOWN.includes(res)){ const err=new Error(res); err.code=res; throw err; } if(res&&res!=='ok'&&res!=='deleted'&&res!=='void'&&!/<html/i.test(res)){ const err=new Error(res); err.code='server'; throw err; } try{ localStorage.setItem(HKEY,JSON.stringify(hist().filter(x=>x.oid!==p[3]))); }catch(e){} SRV=SRV.filter(x=>x.oid!==p[3]); emit(); } }, async get(){ return {exists:false,data:()=>undefined}; } }; },
    collection(path){ const parts=String(path||'').split('/');
      if(path==='orders'){ const q={ orderBy(){ return q; }, limit(){ return q; }, where(){ return q; },
          onSnapshot(next,fail){ let stop=false; const run=async()=>{ try{ const os=await adminList(); if(!stop) next({docs:os.map(o=>({id:o.oid,exists:true,data:()=>({uid:o.oid,store:o.store,contact:o.contact,updatedAt:o.submittedAt})})),size:os.length,empty:!os.length,docChanges:()=>[]}); }catch(e){ if(!stop&&fail) fail(e); } }; run(); const t=setInterval(run,60000); return ()=>{ stop=true; clearInterval(t); }; },
          async get(){ const os=await adminList(); return {docs:os.map(o=>({id:o.oid,data:()=>o}))}; } }; return q; }
      if(parts.length===3&&parts[2]==='subs'&&ACACHE[parts[1]]){ const o=ACACHE[parts[1]]; const q={ orderBy(){ return q; }, limit(){ return q; }, where(){ return q; }, onSnapshot(next){ next({docs:[{id:o.oid,data:()=>o}]}); return ()=>{}; }, async get(){ return {docs:[{id:o.oid,data:()=>o}]}; } }; return q; }
      const q={ orderBy(){ return q; }, limit(){ return q; }, where(){ return q; }, onSnapshot(next){ subs.push(next); setTimeout(emit,0); refreshMine(); return ()=>{ const i=subs.indexOf(next); if(i>=0) subs.splice(i,1); }; }, async get(){ return {docs:[]}; } }; return q; } };
  const downloads={ async save({filename,data}){ const blob=data instanceof Blob?data:new Blob([data]); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },3000); return {status:'saved'}; } };
  const user={ id:async()=>dev, canEdit:async()=>{ await memberGate; return !!(ADMIN&&URL_); }, isOwner:async()=>false, can:async()=>!!URL_ };
  window.claude={ use:async n=> n==='downloads'?downloads : n==='user'?user : n==='db'?(URL_?db:null) : null };
})();
</script>

<script>
(function(){
const ITEMS = window.SDR_ITEMS || [];
const IMG = window.SDR_IMG || {};
const BY = Object.fromEntries(ITEMS.map(i=>[i.id,i]));
// 單色款式圖：有裁切框的款色，款式圖（卡片、放大、Excel）只顯示該色。it.photos 只放實體圖（配色照），沒有就顯示「實體圖待更新」
const PC = window.DSTC_PC || {};
const big = h=>`big/${h}.jpg`;
// 資料待更新說明：網頁頂端與 Excel 訂單本「總表」共用同一份清單（數字依目前資料即時計算）。web=true 時不出現任何韓幣字樣
function dataNotes(web){
  const dc={}; ITEMS.forEach(i=>{ if(i.doll) dc[i.doll]=(dc[i.doll]||0)+1; });
  const nPh=ITEMS.filter(i=>(i.photos||[]).length).length, nMulti=ITEMS.filter(i=>i.doll&&dc[i.doll]>1&&!PC[i.id]).length;
  const nTmp=ITEMS.filter(i=>/暫定/.test(i.note||'')).length, nFab=ITEMS.filter(i=>!i.fab).length, noCc=ITEMS.filter(i=>!i.cc);
  const L=['最終可下單款式，待C TEAM確認',web?'台灣定價待定，待C TEAM確認':'台灣定價待定，待C TEAM確認：本訂單本暫附「韓幣 MSRP(₩)」與「韓幣金額(₩)」欄位，僅供下單參考，台灣定價確定後另行通知',
    '到貨月份待定，待C TEAM確認',
    '尺寸先參考 DESCENTE 尺寸對照表，實際以原廠確認為準',
    '各色開放尺寸原廠未附，暫依性別全段開放，實際以原廠確認為準',
    '商品實體圖，待C TEAM確認：目前以款式圖為主'];
  if(nTmp) L.push(`品名：${nTmp} 款色為原廠暫定名稱`);
  if(nFab) L.push(`材質說明待原廠提供（${nFab} 款色，多為鞋款）`);
  return L;
}
const PCC=new Map();
function pcCrop(src,b){ const key=(src.length>300?src.length+src.slice(40,120):src)+'|'+b.join(); if(PCC.has(key)) return PCC.get(key);
  const pr=new Promise(res=>{ const im=new Image(); im.onload=()=>{ try{ const W=im.naturalWidth,H=im.naturalHeight, x=b[0]*W,y=b[1]*H,w=Math.max(1,(b[2]-b[0])*W),h=Math.max(1,(b[3]-b[1])*H); const c=document.createElement('canvas'); c.width=Math.round(w); c.height=Math.round(h); const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(im,x,y,w,h,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',.92)); }catch(e){ res(null); } }; im.onerror=()=>res(null); im.src=src; });
  PCC.set(key,pr); return pr; }
function applyPC(root){ (root||document).querySelectorAll('img[data-pc]:not([data-pcd])').forEach(img=>{ img.dataset.pcd='1'; const b=PC[img.dataset.pc]; if(!b) return; img.style.visibility='hidden'; pcCrop(img.getAttribute('src'),b).then(u=>{ if(u) img.src=u; img.style.visibility=''; }); }); }
{ const mo=new MutationObserver(()=>{ applyPC(document.getElementById('list')); applyPC(document.getElementById('overlay')); }); const go=()=>['list','overlay'].forEach(id=>{ const el=document.getElementById(id); if(el){ mo.observe(el,{childList:true,subtree:true}); applyPC(el); } }); if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',go); else go(); }

// ---------- lines / CSV ----------
function lines(qty){ const out=[]; for(const it of ITEMS){ const m=qty[it.id]; if(!m) continue; for(const sz of it.sizes){ const q=m[sz]; if(q>0) out.push({k:it.id,sheet:it.sheet,mon:it.mon,style:it.style||'',sku:it.sku||'',en:it.en,zh:it.zh||'',color:it.color,size:sz,qty:q,price:it.price||0}); } } return out; }
const CSV_HEAD=['經銷商','聯絡人','訂單編號','送出時間','分頁','款號','色碼 SKU','英文品名','中文品名','顏色','尺寸','數量','韓幣 MSRP(₩)','韓幣金額(₩)'];
function csvRows(o){ return (o.lines||[]).map(l=>[o.store,o.contact,o.oid,fmtTime(o.submittedAt),l.sheet,l.style,l.sku,l.en,l.zh,l.color,l.size,l.qty,l.price,l.qty*l.price]); }
function toCSV(rows){ return '﻿'+rows.map(r=>r.map(v=>{ v=String(v??''); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }).join(',')).join('\r\n'); }
function fmtTime(t){ if(!t) return ''; const d=new Date(t); const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }
async function saveCSV(name,rows){
  const dl = await (window.claude?.use ? claude.use('downloads') : null);
  if(!dl) throw new Error('這個檢視無法下載檔案。請在 claude.ai 開啟此頁。');
  await dl.save({filename:name,data:toCSV(rows)});
}

const OV_COL=['#0a3f94','#3f7fd9','#8fb8ee','#c9dcf6','#1f6f78','#5fb3b3','#c08a2e','#e2bf7d','#6b6f7a','#b0b5bf'];
function catRows(lines){ const m={}; for(const l of lines){ const c=(BY[l.k]&&BY[l.k].cat)||l.cat||'其他'; const r=m[c]=m[c]||{cat:c,qty:0,amt:0}; r.qty+=l.qty; r.amt+=l.qty*(l.price||0); } return Object.values(m); }
function topN(rows,key){ rows=[...rows].sort((a,b)=>b[key]-a[key]); if(rows.length<=9) return rows; const top=rows.slice(0,8); const rest=rows.slice(8).reduce((o,r)=>({cat:'其他',qty:o.qty+r.qty,amt:o.amt+r.amt}),{cat:'其他',qty:0,amt:0}); return [...top,rest]; }
function pie(rows,key,label){
  const tot=rows.reduce((a,r)=>a+r[key],0); const R=52, C=2*Math.PI*R; let off=0;
  const segs=tot?rows.map((r,i)=>{ const f=r[key]/tot; const len=f*C; const el=`<circle r="${R}" cx="66" cy="66" fill="none" stroke="${OV_COL[i%OV_COL.length]}" stroke-width="22" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 66 66)"><title>${esc(r.cat)} ${Math.round(f*1000)/10}%</title></circle>`; off+=len; return el; }).join(''):'';
  return `<svg viewBox="0 0 132 132" role="img" aria-label="${esc(label)}圓餅圖"><circle r="${R}" cx="66" cy="66" fill="none" stroke="var(--sunk)" stroke-width="22"/>${segs}<text x="66" y="66" text-anchor="middle" class="ov-c1">${key==='amt'?(tot>=10000?Math.round(tot/1000).toLocaleString()+'K':fmt(tot)):fmt(tot)}</text><text x="66" y="80" text-anchor="middle" class="ov-c2">${key==='amt'?'TWD':'件'}</text></svg>`;
}
const GEN_COL={'男':'#2f3e52','女':'#d8656c','中性':'#a48a6b'};
const genOf=l=>(BY[l.k]&&BY[l.k].gen)||'中性';
function genRows(lines){ const m={}; for(const l of lines){ const g=genOf(l); const r=m[g]=m[g]||{cat:g,qty:0,amt:0}; r.qty+=l.qty; r.amt+=l.qty*(l.price||0); } return ['男','女','中性'].filter(g=>m[g]).map(g=>m[g]); }
function ovCard(rows,key,title,colors){ const rs=colors?rows:topN(rows,key); const tot=rs.reduce((a,r)=>a+r[key],0); const col=(r,i)=>colors?colors[r.cat]:OV_COL[i%OV_COL.length];
  const R=52, C=2*Math.PI*R; let off=0;
  const segs=tot?rs.map((r,i)=>{ const f=r[key]/tot; const len=f*C; const el=`<circle r="${R}" cx="66" cy="66" fill="none" stroke="${col(r,i)}" stroke-width="22" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 66 66)"><title>${esc(r.cat)} ${Math.round(f*1000)/10}%</title></circle>`; off+=len; return el; }).join(''):'';
  const center=key==='amt'?(tot>=10000?Math.round(tot/1000).toLocaleString()+'K':fmt(tot)):fmt(tot);
  const svg=`<svg viewBox="0 0 132 132" role="img" aria-label="${esc(title)}"><circle r="${R}" cx="66" cy="66" fill="none" stroke="var(--sunk)" stroke-width="22"/>${segs}<text x="66" y="66" text-anchor="middle" class="ov-c1">${center}</text><text x="66" y="80" text-anchor="middle" class="ov-c2">${key==='amt'?'TWD':'件'}</text></svg>`;
  return `<div class="ov-card"><h3>${title}</h3><div class="ov-top">${svg}<div class="ov-leg">${rs.map((r,i)=>`<div><i style="background:${col(r,i)}"></i><span>${esc(r.cat)}</span><b>${fmt(r[key])}</b><em>${tot?(Math.round(r[key]/tot*1000)/10).toFixed(1):0}%</em></div>`).join('')}</div></div></div>`; }
const OVSTORE={}; let ovN=0;
function ovInner(lines,g){ const gr=genRows(lines); const sub=g==='all'?lines:lines.filter(l=>genOf(l)===g); const cr=catRows(sub);
  const tabs=`<div class="zm-tabs ov-g">${[['all','全部'],...gr.map(r=>[r.cat,r.cat])].map(([k,n])=>`<button data-ovg="${k}" aria-pressed="${k===g}">${n}</button>`).join('')}</div>`;
  return `<div class="ov-sec">依性別</div><div class="ov-wrap">${ovCard(gr,'qty','性別件數佔比',GEN_COL)}</div>
  <div class="ov-sec">依品類 ${tabs}</div>${cr.length?`<div class="ov-wrap">${ovCard(cr,'qty',(g==='all'?'':g+'・')+'品類件數佔比')}</div>`:'<div class="ov-empty">這個性別沒有下單。</div>'}`; }
function overviewHTML(lines){
  if(!lines.length) return '<div class="ov-empty">還沒有數量。填了尺寸數量後，這裡會依性別和品類顯示件數和金額佔比。</div>';
  const k='ov'+(++ovN); OVSTORE[k]=lines; return `<div class="ov" data-ovk="${k}">${ovInner(lines,'all')}</div>`; }
document.addEventListener('click',e=>{ const b=e.target.closest('[data-ovg]'); if(!b) return; const w=b.closest('[data-ovk]'); if(!w) return; w.innerHTML=ovInner(OVSTORE[w.dataset.ovk]||[],b.dataset.ovg); });

  btn.disabled=false; btn.textContent='下載 Excel 訂單本';
  if(ok){ const t=totals();
    $('#overlay').innerHTML=`<div class="scrim"><div class="panel" style="height:auto;margin:auto;max-width:440px;border-radius:8px"><h2>訂單本已下載</h2><div class="msg ok">${esc(S.dealer.store)}：${t.sty} 款色、${fmt(t.qty)} 件。</div><p style="margin:0">請把剛下載的 Excel 檔用 <b>LINE 或 Email</b> 傳給 DESCENTE 業務，業務收到後會幫你登錄訂單。</p><p style="margin:0;color:var(--muted);font-size:12px">頁面上的數量會保留在這台裝置，之後要修改可以直接改完再下載一次。</p><div style="display:flex;justify-content:flex-end"><button class="btn pri" data-close>好</button></div></div></div>`; }
}
function brList(qty,meta){ return (meta&&meta.branches&&meta.branches.length)?meta.branches:[{name:'',qty}]; }
function orderText(qty,meta){ const L=[]; let sty=0,tq=0,ta=0; const agg=lines(qty); const ks=new Set(); agg.forEach(l=>{ ks.add(l.k); tq+=l.qty; ta+=l.qty*l.price; }); sty=ks.size;
  L.push(`【DESCENTE 27Q3Q4 訂單】${meta.store||''}｜${meta.contact||''}${meta.phone?'｜'+meta.phone:''}${meta.oid?'｜'+meta.oid:''}`); if(meta.note) L.push('備註：'+meta.note);
  for(const b of brList(qty,meta)){ if(b.name) L.push('',`■ ${b.name}`); let cur=null; for(const l of lines(b.qty)){ if(l.k!==cur){ L.push(`${l.style} ${l.sku} ${l.zh||l.en} ${l.color}`); cur=l.k; } L[L.length-1]+=` ${l.size}×${l.qty}`; } }
  L.push('',`合計 ${sty} 款色、${tq} 件`); return L.join('\n'); }
function orderTSV(qty,meta){ const R=[['經銷商／店名',meta.store||''],['聯絡人',meta.contact||''],['電話',meta.phone||''],['訂單備註',meta.note||''],[]];
  R.push(['分店','分頁','款號','色碼 SKU','英文品名','中文品名','顏色','尺寸','數量','韓幣 MSRP(₩)','韓幣金額(₩)']);
  for(const b of brList(qty,meta)) for(const l of lines(b.qty)) R.push([b.name||(meta.store||''),l.sheet,l.style,l.sku,l.en,l.zh,l.color,l.size,l.qty,l.price,l.qty*l.price]);
  return R.map(r=>r.map(v=>String(v??'').replace(/[\t\n\r]+/g,' ')).join('\t')).join('\n'); }
function openCopyPanel(qty,meta,timedOut){ let mode='tsv'; const get=()=>mode==='tsv'?orderTSV(qty,meta):orderText(qty,meta);
  const d=document.createElement('div'); d.className='scrim'; d.style.zIndex=60;
  d.innerHTML=`<div class="panel" style="height:auto;margin:auto;max-width:600px;border-radius:8px"><div class="phead"><h2>改用複製傳單</h2><button class="btn sm x" data-x>關閉</button></div>
  <p style="margin:0;font-size:13px">${timedOut?'下載沒有回應（如果稍後跳出下載確認，也可以照常存檔）。':'你的帳號在這個頁面不能直接下載檔案（只有頁面擁有者可以）。'}請改用複製：</p>
  <div class="zm-tabs" style="align-self:flex-start"><button data-mode="tsv" aria-pressed="true">貼到 Excel（表格）</button><button data-mode="txt" aria-pressed="false">貼到 LINE（文字）</button></div>
  <p id="cp-hint" style="margin:0;color:var(--muted);font-size:12px">複製後打開空白 Excel，點 A1 貼上就是一張訂單表，存檔後傳給 DESCENTE 業務；業務可以直接匯入這個檔案。</p>
  <textarea id="ord-txt" rows="11" style="width:100%;font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:6px;padding:8px;background:var(--surface);color:var(--fg);white-space:pre" readonly></textarea>
  <div id="cp-msg"></div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn pri" id="cp-btn">複製</button></div></div>`;
  document.body.appendChild(d); const ta=d.querySelector('#ord-txt'); ta.value=get();
  const say=(k,t)=>{ d.querySelector('#cp-msg').innerHTML=`<div class="msg ${k}">${esc(t)}</div>`; };
  d.addEventListener('click',e=>{ const m=e.target.closest('[data-mode]'); if(m){ mode=m.dataset.mode; d.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',x===m)); ta.value=get(); d.querySelector('#cp-hint').textContent=mode==='tsv'?'複製後打開空白 Excel，點 A1 貼上就是一張訂單表，存檔後傳給 DESCENTE 業務；業務可以直接匯入這個檔案。':'複製後直接貼到 LINE 或 Email 傳給 DESCENTE 業務。'; d.querySelector('#cp-msg').innerHTML=''; return; }
    if(e.target.closest('#cp-btn')){ navigator.clipboard.writeText(ta.value).then(()=>say('ok',mode==='tsv'?'已複製。打開 Excel 點 A1 貼上即可。':'已複製，可以貼到 LINE 或 Email。'),()=>{ ta.focus(); ta.select(); say('info','已選取全部內容，請按 Ctrl+C（手機長按）複製。'); }); return; }
    if(e.target.closest('[data-x]')||e.target===d) d.remove(); }); }
function msg(sel,kind,text){ const el=$(sel); if(el) el.innerHTML=`<div class="msg ${kind}">${esc(text)}</div>`; }

const AUTH=window.SDR_AUTH||null; let acctStep='email', acctEmail='';
function renderAcct(note,kind){
  const box=$('#acct'); if(!AUTH||adminEditing()){ box.hidden=true; return; } box.hidden=false;
  const a=AUTH.get(); const m=note?`<div class="am ${kind==='err'?'err':''}">${esc(note)}</div>`:'';
  if(a){ box.className='acct'; box.innerHTML=`<span class="t">已登入：<b>${esc(a.email)}</b>　訂單確認信與 Excel 訂單本會寄到這個信箱。</span><button class="btn sm" id="ac-out">登出</button>${m}`;
    if(!S.dealer.email){ S.dealer.email=a.email; $('#d-email').value=a.email; saveDraft(); } return; }
  box.className='acct need';
  if(acctStep==='code') box.innerHTML=`<span class="t">驗證碼已寄到 <b>${esc(acctEmail)}</b>，請輸入信中的 6 位數字（10 分鐘內有效）。</span><input class="cd" id="ac-code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000"><button class="btn sm pri" id="ac-verify">登入</button><button class="btn sm" id="ac-back">換 Email</button>${m}`;
  else box.innerHTML=`<span class="t"><b>下單前請先登入</b>　輸入 Email，我們會寄一組驗證碼給你（不用設密碼）。</span><input class="em" id="ac-email" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" value="${esc(acctEmail||S.dealer.email||'')}"><button class="btn sm pri" id="ac-send">寄驗證碼</button>${m}`;
}
$('#acct').addEventListener('click',async e=>{
  if(e.target.closest('#ac-out')){ AUTH.logout(); acctStep='email'; renderAcct('已登出。'); return; }
  if(e.target.closest('#ac-back')){ acctStep='email'; renderAcct(); return; }
  const sb=e.target.closest('#ac-send'); if(sb){ const em=$('#ac-email').value.trim(); if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){ renderAcct('Email 格式不正確','err'); return; }
    sb.disabled=true; sb.textContent='寄送中…'; acctEmail=em;
    try{ const r=await AUTH.sendCode(em); if(r==='ok'||r==='wait'){ acctStep='code'; renderAcct(r==='wait'?'剛剛已寄過，請先查看信箱（含垃圾郵件）；1 分鐘後可再寄一次。':'沒收到的話，請看一下垃圾郵件匣。'); setTimeout(()=>$('#ac-code')?.focus(),50); } else renderAcct('寄送失敗（'+r+'），請確認 Email 後再試。','err'); }
    catch(err){ renderAcct('寄送失敗，請檢查網路後再試。','err'); } return; }
  const vb=e.target.closest('#ac-verify'); if(vb){ const code=$('#ac-code').value.trim(); if(!/^\d{6}$/.test(code)){ renderAcct('請輸入 6 位數驗證碼','err'); return; }
    vb.disabled=true; vb.textContent='驗證中…';
    try{ const r=await AUTH.verify(acctEmail,code); if(r.token){ acctStep='email'; renderAcct('登入成功，可以下單了。'); applyMode(); }
      else renderAcct({bad_code:'驗證碼不正確，請再試一次。',expired:'驗證碼已過期，請重新寄送。',too_many:'錯誤次數太多，請重新寄送驗證碼。'}[r.error]||('驗證失敗（'+r.error+'）'),'err'); }

async function xlsxForMail(qty,meta){
  try{ const buf=await withTimeout((async()=>{ const wb=await buildBook(qty,meta); return await wb.xlsx.writeBuffer(); })(),40000,null); if(!buf||buf.byteLength>15e6) return null;

// ---------- 下單分析：款色、尺寸、大類、系列 ----------
// 款色＝款號＋顏色（商品資料一列、一個色碼）。尺寸＝款號＋顏色＋有下單的尺寸。
// 這季目錄都是服裝。大類依品類，跟三個分頁不同：羽絨分頁裡的外套和背心會分開算。
const AN_GROUPS=[['上衣',['短袖T恤','長袖T恤','短袖POLO衫','長袖POLO衫']],['外套',['羽絨外套','輕量羽絨外套','外套']],['背心',['羽絨背心','背心']],['長褲',['長褲']]];
function anGroupOf(it){
  if(!it) return '找不到商品';
  const cat=String(it.cat||'');
  for(const [g,cs] of AN_GROUPS) if(cs.includes(cat)) return g;
  const s=cat+' '+String(it.sheet||'');
  if(/鞋|靴/.test(s)) return '鞋款';
  if(/帽|手套|襪|毛巾|皮帶|球袋|配件|包/.test(s)) return '配件';
  if(/褲|裙/.test(s)) return '長褲';
  if(/背心/.test(s)) return '背心';
  if(/外套|羽絨|夾克/.test(s)) return '外套';
  if(/衣|衫|T恤|POLO|上衣/.test(s)) return '上衣';
  return '其他';
}
function anSeries(it){
  if(!it) return '找不到商品';
  const raw=String(it.series||'').replace(/[ \t]+\n/g,'\n').trim();
  const tagged=raw.match(/系列[：:]\s*([^\n]+)/);
  if(tagged&&tagged[1].trim()) return tagged[1].trim();
  if(raw){
    const parts=raw.split(/[｜|]/).map(s=>s.trim()).filter(Boolean);
    if(parts.length>=2) return parts[0]===parts[1]?parts[0]:parts[0]+'｜'+parts[1];
    return parts[0]||raw;
  }
  const theme=String(it.theme||'').trim();
  return theme||'未標系列';
}
function anItem(l){
  if(l&&l.k&&BY[l.k]) return BY[l.k];
  if(l&&l.sku){ const sku=String(l.sku); return ITEMS.find(i=>i.sku===sku&&(!l.sheet||i.sheet===l.sheet))||ITEMS.find(i=>i.sku===sku)||null; }
  return null;
}
function analyzeLines(lines){
  const colors=new Map();
  for(const l of lines||[]){
    const qty=Number(l.qty)||0; if(!(qty>0)) continue;
    const it=anItem(l);
    const style=it?it.style:(l.style||''), color=it?it.color:(l.color||''), sku=it?it.sku:(l.sku||'');
    const ck=it?it.id:('x:'+style+'|'+color+'|'+sku);
    const size=String(l.size||'');
    let c=colors.get(ck);
    if(!c){ c={sheet:it?it.sheet:(l.sheet||'其他'),series:anSeries(it),group:anGroupOf(it),qty:0,amt:0,sizes:new Set()}; colors.set(ck,c); }
    const price=Number(l.price!=null&&l.price!==''?l.price:(it&&it.price)||0);
    c.qty+=qty; c.amt+=qty*price;
    if(size) c.sizes.add(ck+'|'+size);
  }
  const bySheet=new Map(), bySeries=new Map(), byGroup=new Map();
  const tot={colors:0,sizes:0,qty:0,amt:0};
  const add=(map,key,c)=>{ let r=map.get(key); if(!r){ r={key,colors:0,sizes:0,qty:0,amt:0}; map.set(key,r); } r.colors++; r.sizes+=c.sizes.size; r.qty+=c.qty; r.amt+=c.amt; };
  for(const c of colors.values()){
    tot.colors++; tot.sizes+=c.sizes.size; tot.qty+=c.qty; tot.amt+=c.amt;
    add(bySheet,c.sheet||'其他',c); add(bySeries,c.series,c); add(byGroup,c.group,c);
  }
  return {tot,bySheet,bySeries,byGroup};
}
function anPct(n,d){ return d?(Math.round(n/d*1000)/10).toFixed(1)+'%':'–'; }
function anGroupRows(a){
  const rows=[], seen=new Set(AN_GROUPS.map(g=>g[0]));
  for(const [g] of AN_GROUPS){ const r=a.byGroup.get(g); if(r) rows.push(r); }
  for(const [k,r] of a.byGroup) if(!seen.has(k)) rows.push(r);
  return rows;
}
function anSheetRows(a){
  const rows=[], seen=new Set();
  for(const sh of SHEETS){ const r=a.bySheet.get(sh); if(r){ rows.push(r); seen.add(sh); } }
  for(const [s,r] of a.bySheet) if(!seen.has(s)) rows.push(r);
  return rows;
}
function anSeriesRows(a){ return [...a.bySeries.values()].sort((x,y)=>y.amt-x.amt||y.qty-x.qty||String(x.key).localeCompare(String(y.key),'zh-Hant')); }
function anTable(title,label,rows,tot,note){
  if(!rows.length) return '';
  const body=rows.map(r=>`<tr><td>${esc(r.key)}</td><td class="r num">${fmt(r.colors)}</td><td class="r num">${fmt(r.sizes)}</td><td class="r num">${fmt(r.qty)}</td><td class="r num">${anPct(r.qty,tot.qty)}</td></tr>`).join('');
  return `<div><h3>${esc(title)}</h3><div class="tbl"><table><thead><tr><th>${esc(label)}</th><th class="r">款色數</th><th class="r">尺寸數</th><th class="r">件數</th><th class="r">件數佔比</th></tr></thead><tbody>${body}</tbody><tfoot><tr><td>合計</td><td class="r num">${fmt(tot.colors)}</td><td class="r num">${fmt(tot.sizes)}</td><td class="r num">${fmt(tot.qty)}</td><td class="r num">100%</td></tr></tfoot></table></div>${note?`<p class="subnote">${note}</p>`:''}</div>`;
}
function anTables(a,notes){
  if(!a.tot.qty) return '';

const norm=s=>String(s??'').toUpperCase().replace(/[\s_]+/g,' ').replace(/^AP ?/,'').trim();
let sjP=null;
function loadSheetJS(){ if(window.XLSX) return Promise.resolve(window.XLSX); if(!sjP) sjP=new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload=()=>res(window.XLSX); s.onerror=()=>{ sjP=null; rej(new Error('Excel 元件載入失敗，請檢查網路後再試一次。')); }; document.head.appendChild(s); }); return sjP; }
async function importBook(file){
  const X=await loadSheetJS();
  const wb=X.read(new Uint8Array(await file.arrayBuffer()),{type:'array'});
  const qty={}; const dealer={}; let cells=0; const miss=[]; const bad=[];
  const rowsOf=n=>X.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null,blankrows:true});
  const txt=v=>String(v??'').split('\n')[0].trim();
  { const first=wb.SheetNames.find(n=>n!=='總表'); if(!wb.Sheets['總表']&&first){ rowsOf(first).slice(0,6).forEach(row=>{ const k=txt((row||[])[0]); const m={'經銷商／店名':'store','聯絡人':'contact','電話':'phone','訂單備註':'note'}; if(m[k]&&row[1]!=null&&String(row[1]).trim()) dealer[m[k]]=String(row[1]).trim(); }); } }
  if(wb.Sheets['總表']){ const L={'經銷商／店名':'store','經銷公司／店名':'store','聯絡人':'contact','電話':'phone','Email':'email','訂單備註':'note'};
    rowsOf('總表').forEach(row=>{ (row||[]).forEach((v,col)=>{ const k=txt(v); if(L[k]){ for(let j=col+1;j<=col+4;j++){ const x=row[j]; if(x!=null&&String(x).trim()){ dealer[L[k]]=String(x).trim(); break; } } } }); }); }
  const byEnColor={}, bySku={};
  ITEMS.forEach(i=>{ byEnColor[norm(i.en)+'|'+norm(i.color)]=i; if(i.sku&&!/待確認/.test(i.sku)) bySku[i.sku.toUpperCase()]=i; });
  const SKIP=/MSRP|韓幣|₩|價|訂購|零售|下單|售價|金額|合計|品名|顏色|款號|色碼|色號|月份|主題|Drop|品類|大類|性別|Icon|布料|尺寸|系列|商品|材質|備註|上市|ETA|圖|No\.|PAR|KEY/i;
  let branches=null;
  if(wb.Sheets['分店配貨']){ const rows=rowsOf('分店配貨'); let h=-1,hdr=[]; for(let r=0;r<Math.min(rows.length,12);r++){ const t=(rows[r]||[]).map(txt); if(t.includes('KEY')&&t.includes('尺寸')){ h=r; hdr=t; break; } }
    if(h>=0){ const iK=hdr.indexOf('KEY'), iZ=hdr.indexOf('尺寸'), iT=hdr.indexOf('合計'), iE=hdr.indexOf('英文品名'), iC=hdr.indexOf('顏色'); const names=hdr.slice(iZ+1,iT>iZ?iT:undefined).filter(Boolean);
      branches=names.map(n=>({name:n,qty:{}}));
      for(let r=h+1;r<rows.length;r++){ const row=rows[r]||[]; let it=BY[txt(row[iK])]; if(!it&&iE>=0) it=byEnColor[norm(row[iE])+'|'+norm(row[iC])]; const z=txt(row[iZ]); if(!it||!z) continue;
        names.forEach((n,k)=>{ let v=row[iZ+1+k]; v=typeof v==='number'?v:parseInt(String(v??'').replace(/[^\d]/g,''),10); if(!(v>0)) return; if(!it.sizes.includes(z)){ bad.push(`${n}：${it.zh||it.en} ${it.color} ${z}`); return; } (branches[k].qty[it.id]=branches[k].qty[it.id]||{})[z]=Math.min(9999,Math.round(v)); }); }
      branches=branches.filter(b=>b.name); if(!branches.length) branches=null; } }
  for(const name of wb.SheetNames){
    if(name==='總表'||name==='分店配貨') continue;
    const rows=rowsOf(name); let h=-1, map={};
    for(let r=0;r<Math.min(rows.length,12)&&h<0;r++){ const m={}; (rows[r]||[]).forEach((v,c)=>{ const t=txt(v); if(t&&!(t in m)) m[t]=c; }); if(('KEY' in m)||(('英文品名' in m)&&('顏色' in m))){ h=r; map=m; } }
    if(h<0) continue;
    const skuKey=Object.keys(map).find(k=>k.startsWith('色碼'));
    if(('尺寸' in map)&&('數量' in map)&&!('KEY' in map&&!('英文品名' in map))){
      const hasBr=('分店' in map); const brs={};
      for(let r=h+1;r<rows.length;r++){ const row=rows[r]||[]; let it=null; const en=row[map['英文品名']], col=row[map['顏色']];
        if(en) it=byEnColor[norm(en)+'|'+norm(col)]; if(!it&&skuKey){ const sv=txt(row[map[skuKey]]).toUpperCase(); if(sv) it=bySku[sv]; }
        const z=txt(row[map['尺寸']]); let v=row[map['數量']]; v=typeof v==='number'?v:parseInt(String(v??'').replace(/[^\d]/g,''),10); if(!z||!(v>0)) continue; v=Math.min(9999,Math.round(v));
        if(!it){ miss.push(`${name} 第 ${r+1} 列 ${en||''} ${col||''}`.trim()); continue; }
        if(!it.sizes.includes(z)){ bad.push(`${it.zh||it.en} ${it.color} ${z}`); continue; }
        (qty[it.id]=qty[it.id]||{})[z]=((qty[it.id]||{})[z]||0)+v; cells++;
        if(hasBr){ const bn=txt(row[map['分店']])||'店點 1'; const bq=brs[bn]=brs[bn]||{}; (bq[it.id]=bq[it.id]||{})[z]=((bq[it.id]||{})[z]||0)+v; } }
      if(hasBr&&Object.keys(brs).length>1&&!branches) branches=Object.entries(brs).map(([n,q])=>({name:n,qty:q}));
      continue;
    }
    const sizeKeys=Object.keys(map).filter(k=>!SKIP.test(k));
    for(let r=h+1;r<rows.length;r++){
      const row=rows[r]||[]; let it=null;
      const key=('KEY' in map)?txt(row[map['KEY']]):''; if(key&&BY[key]) it=BY[key];
      const en=('英文品名' in map)?row[map['英文品名']]:null, col=('顏色' in map)?row[map['顏色']]:null;
      if(!it&&en) it=byEnColor[norm(en)+'|'+norm(col)];
      if(!it&&skuKey){ const sv=txt(row[map[skuKey]]).toUpperCase(); if(sv) it=bySku[sv]; }
      let any=false;
      for(const z of sizeKeys){ let v=row[map[z]]; v=typeof v==='number'?v:parseInt(String(v??'').replace(/[^\d]/g,''),10); if(!(v>0)) continue; v=Math.min(9999,Math.round(v)); any=true;
        if(!it) continue;
        if(!it.sizes.includes(z)){ bad.push(`${it.zh||it.en} ${it.color} ${z}`); continue; }
        (qty[it.id]=qty[it.id]||{})[z]=v; cells++; }
      if(any&&!it&&(en||key)) miss.push(`${name} 第 ${r+1} 列 ${en||key} ${col||''}`.trim());
    }
  }
  if(branches){ const a={}; branches.forEach(b=>{ for(const id in b.qty) for(const z in b.qty[id]){ a[id]=a[id]||{}; a[id][z]=(a[id][z]||0)+b.qty[id][z]; } }); return {qty:a,dealer,cells,miss,bad,branches}; }
  return {qty,dealer,cells,miss,bad};
}

$('#x-import').addEventListener('click',()=>$('#x-file').click());
$('#x-file').addEventListener('change',async e=>{ const f=e.target.files[0]; e.target.value=''; if(!f) return; $('#x-msg').textContent='讀取中…';
  try{ const res=await importBook(f); $('#x-msg').textContent='';
    const n=Object.keys(res.qty).length; let q=0; for(const id in res.qty) for(const z in res.qty[id]) q+=res.qty[id][z];
    const had=totals().qty;
    const list=a=>a.length?`<ul style="margin:4px 0 0;padding-left:18px;max-height:140px;overflow:auto">${a.slice(0,40).map(x=>`<li>${esc(x)}</li>`).join('')}${a.length>40?`<li>…等 ${a.length} 筆</li>`:''}</ul>`:'';
    $('#overlay').innerHTML=`<div class="scrim"><div class="panel" style="height:auto;margin:auto;max-width:480px;border-radius:8px"><h2>匯入 Excel</h2>
      ${n?`<div class="msg ok">讀到 <b>${n}</b> 款色、<b>${fmt(q)}</b> 件${res.branches?`，分 <b>${res.branches.length}</b> 家分店（${res.branches.map(b=>esc(b.name)).join('、')}）`:''}。</div>`:`<div class="msg err">這個檔案裡沒有讀到任何數量。請確認是這個下單頁下載的訂單本，或是有「英文品名」「顏色」和尺寸欄位的訂單本。</div>`}
      ${res.miss.length?`<div class="msg err">找不到對應商品，略過：${list(res.miss)}</div>`:''}
      ${res.bad.length?`<div class="msg err">這些尺寸沒有供貨，略過：${list(res.bad)}</div>`:''}
      ${had&&n?'<p style="margin:0;color:var(--muted)">匯入會取代目前頁面上填的數量。</p>':''}
      <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" data-close>取消</button>${n?'<button class="btn pri" id="do-import">套用到下單頁</button>':''}</div></div></div>`;
    if(n) $('#do-import').onclick=()=>{ S.qty=res.qty; S.editing=null; S.chain=false; S.br=[]; S.bq={}; S.cur=null; if(res.branches){ S.chain=true; S.br=res.branches.map(b=>({id:brId(),name:b.name})); S.br.forEach((b,i)=>S.bq[b.id]=res.branches[i].qty); S.cur=S.br[0].id; recalcAgg(); } ['store','contact','phone','email','note'].forEach(k=>{ if(res.dealer[k]){ S.dealer[k]=res.dealer[k]; $('#d-'+k).value=res.dealer[k]; } }); saveDraft(); S.only=true; $('#only').checked=true; closeOverlay(); renderAll(); $('#x-msg').textContent='已匯入，下面只顯示有數量的商品；取消勾選「只看已下單」可看全部。'; };
  }catch(err){ $('#x-msg').textContent=err.message||'讀不到這個檔案，請確認是 .xlsx。'; }
});
function renderBranchBar(){ const bar=$('#brbar'); bar.hidden=!S.chain; $('#chain').checked=S.chain; if(!S.chain){ bar.innerHTML=''; return; }
  bar.innerHTML='<span class="lab">分店</span>'+S.br.map(b=>{ const t=brStats(b); return `<span class="br info">${esc(b.name)}<small>${t.qty} 件</small></span>`; }).join('')+'<button class="br add" data-bradd>＋新增店點</button><button class="br mng" data-brmng>管理</button>'; }
function brDialog(title,val,onOk){ $('#overlay').innerHTML=`<div class="scrim"><div class="panel" style="height:auto;margin:auto;max-width:400px;border-radius:8px"><h2>${title}</h2><div class="fld"><label for="br-name">店點名稱</label><input id="br-name" value="${esc(val||'')}" placeholder="例如：台北信義店"></div><div id="br-msg"></div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" data-close>取消</button><button class="btn pri" id="br-ok">確定</button></div></div></div>`; const inp=$('#br-name'); inp.focus(); inp.select();
  const go=()=>{ const v=inp.value.trim(); if(!v){ msg('#br-msg','err','請輸入店點名稱。'); return; } if(S.br.some(b=>b.name===v&&b.name!==val)){ msg('#br-msg','err','已經有同名的店點。'); return; } onOk(v); closeOverlay(); saveDraft(); renderAll(); };
  $('#br-ok').onclick=go; inp.addEventListener('keydown',e=>{ if(e.key==='Enter') go(); }); }
function openBranchMgr(){ const rows=S.br.map(b=>{ const t=brStats(b); return `<tr><td>${esc(b.name)}</td><td class="r num">${t.qty}</td><td class="r"><button class="btn sm" data-brren="${b.id}">改名</button> <button class="btn sm" data-brdel="${b.id}" ${S.br.length<2?'disabled':''}>刪除</button></td></tr>`; }).join('');

<script>
(function(){
  var rail=document.getElementById('rail'), tg=document.getElementById('railTg'), sumEl=document.getElementById('railSum');
  if(!rail||!tg||!sumEl) return;
  var crumb=document.getElementById('crumbTx'), crumbX=document.getElementById('crumbX');
  var mq=window.matchMedia('(max-width:760px)');
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function lab(b){ var c=b.cloneNode(true); c.querySelectorAll('small,.dot,svg').forEach(function(x){x.remove();}); return c.textContent.trim(); }
  function pressed(sel){ return document.querySelector(sel+' [aria-pressed="true"]'); }
  function update(){
    var path=[], filtered=false;
    ['#gens','#cgs'].forEach(function(id){ var b=pressed(id); if(b){ var t=lab(b); if(t&&t!=='全部'){ path.push(t); filtered=true; } } });
    var only=document.getElementById('only'), q=document.getElementById('q');
    if(only&&only.checked){ path.push('只看已下單'); }
    else { var s=pressed('#tabs')||pressed('#subtabs'); if(s) path.push(lab(s)); }
    var mo=pressed('#months'); if(mo){ var mt=lab(mo); if(mt&&mt!=='全部') path.push(mt); }
    var n=document.querySelectorAll('#list .item').length;
    var qv=q&&q.value.trim(); var l1=path.join(' › ')||'全部', l2=n+' 款色'+(qv?'・搜尋「'+qv+'」':'');
    sumEl.innerHTML='<b>'+esc(l1)+'</b>'+esc(l2);
    if(crumb) crumb.innerHTML='<span class="crumb-l">目前篩選</span><b>'+esc(l1)+'</b>・共 '+n+' 款色'+(qv?'・搜尋「'+esc(qv)+'」':'');
    if(crumbX) crumbX.hidden=!filtered;
  }
  var tmr=null; function later(){ clearTimeout(tmr); tmr=setTimeout(update,40); }
  ['list','tabs','subtabs','gens','cgs'].forEach(function(id){ var el=document.getElementById(id); if(el) new MutationObserver(later).observe(el,{childList:true,subtree:true}); });
  ['only','q'].forEach(function(id){ var el=document.getElementById(id); if(el){ el.addEventListener('input',later); el.addEventListener('change',later); } });
  function fold(v,save){ rail.classList.toggle('folded',v); tg.setAttribute('aria-expanded',String(!v)); tg.querySelector('.tx').textContent=v?'展開篩選':'收合'; if(save){ try{ sessionStorage.setItem('railFold',v?'1':'0'); }catch(e){} } }
  function toggle(){ fold(!rail.classList.contains('folded'),true); }
  tg.addEventListener('click',toggle); sumEl.addEventListener('click',toggle);
  var sv=null; try{ sv=sessionStorage.getItem('railFold'); }catch(e){}
  fold(sv==='1',false);
  if(document.getElementById('gens')) document.addEventListener('click',function(e){
    if(!mq.matches) return; var b=e.target.closest&&e.target.closest('#tabs [data-s],#subtabs [data-s]'); if(b&&!b.disabled) fold(true,true);
  });
  if(crumbX) crumbX.addEventListener('click',function(){ ['[data-gn=""]','[data-cg=""]'].forEach(function(s){ var b=document.querySelector(s); if(b&&b.getAttribute('aria-pressed')!=='true') b.click(); }); });
  update();
})();
</script>
